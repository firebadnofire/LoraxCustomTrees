name: Development release
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    permissions:
      contents: read
    steps:
      - run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends git
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select repository Java
        run: |
          set -eu
          case "$GITHUB_REPOSITORY" in
            */LoraxCustomTrees) echo 'BUILD_JAVA=25' >> "$GITHUB_ENV" ;;
            */DropsOverhaul) echo 'BUILD_JAVA=21' >> "$GITHUB_ENV" ;;
            *) echo 'Unsupported repository' >&2; exit 1 ;;
          esac
      - uses: https://data.forgejo.org/actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA }}
      - run: ./gradlew build --no-daemon
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: plugin
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-tests.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    permissions:
      contents: write
    steps:
      - run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends gnupg python3
      # No checkout: repository build scripts never receive signing secrets.
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: plugin
          path: dist
      - name: Sign and verify
        env:
          CI_KEY_B64: ${{ secrets.CI_KEY_B64 }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill gpg-agent; rm -rf -- "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$CI_KEY_B64" | base64 --decode | gpg --batch --import
          unset CI_KEY_B64
          cd dist
          shopt -s nullglob
          jars=(*.jar)
          ((${#jars[@]})) || { echo 'No plugin JARs received' >&2; exit 1; }
          for jar in "${jars[@]}"; do
            [[ -f "$jar" && ! -L "$jar" && "$jar" != *$'\n'* ]] || exit 1
          done
          sha256sum -- "${jars[@]}" > SHA256SUMS
          for file in "${jars[@]}" SHA256SUMS; do
            printf '%s\n' "$CI_KEY_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign -- "$file"
            gpg --batch --verify "$file.asc" "$file"
          done
          sha256sum --check --strict SHA256SUMS
      - name: Publish draft then finalize prerelease
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request, urllib.error, uuid
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Invalid commit SHA'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          base = os.environ['GITHUB_API_URL'] + '/repos/' + repo
          assert base.startswith('https://'), 'HTTPS API required'
          tag = 'build-' + sha[:12]
          def api(method, path, body=None, content_type='application/json'):
              if isinstance(body, dict): body = json.dumps(body).encode()
              request = urllib.request.Request(base + path, data=body, method=method,
                  headers={'Authorization': 'token ' + os.environ['RELEASE_TOKEN'], 'Content-Type': content_type})
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and method == 'GET': return None
                  raise RuntimeError(f'{method} {path}: HTTP {error.code}; verify repository tag/release/asset permissions. Draft may remain; inspect before rerunning.') from None
          # Fail closed on reruns and partial publication; never replace assets.
          assert api('GET', '/releases/tags/' + tag) is None, 'Release already exists: inspect it; no assets overwritten'
          assert api('GET', '/tags/' + tag) is None, 'Tag already exists: inspect conflict; no tag moved'
          branch = api('GET', '/branches/main')
          assert branch and branch.get('protected'), 'main must be protected before signing releases'
          files = sorted(pathlib.Path('dist').iterdir())
          assert files and all(p.is_file() and not p.is_symlink() for p in files)
          java = '25' if repo.endswith('/LoraxCustomTrees') else '21'
          release = api('POST', '/releases', {'tag_name': tag, 'target_commitish': sha,
              'name': 'Development Build ' + sha[:12], 'draft': True, 'prerelease': True,
              'body': f'Repository: {repo}\nCommit: {sha}\nBranch: main\nBuild system: Gradle\nJava: {java}'})
          rid = release['id']
          print(f'Created draft release {rid} for {sha}')
          for file in files:
              boundary = uuid.uuid4().hex
              data = (f'--{boundary}\r\nContent-Disposition: form-data; name="attachment"; filename="{file.name}"\r\nContent-Type: application/octet-stream\r\n\r\n').encode() + file.read_bytes() + f'\r\n--{boundary}--\r\n'.encode()
              api('POST', f'/releases/{rid}/assets', data, 'multipart/form-data; boundary=' + boundary)
          assets = api('GET', f'/releases/{rid}/assets')
          assert {a['name']: a['size'] for a in assets} == {p.name: p.stat().st_size for p in files}, 'Draft asset verification failed'
          api('PATCH', f'/releases/{rid}', {'draft': False, 'prerelease': True})
          print(f'Published {tag}')
          PY
