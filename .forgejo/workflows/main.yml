name: Build and development release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
enable-openid-connect: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends git
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select repository Java
        run: |
          set -eu
          case "$GITHUB_REPOSITORY" in
            */LoraxCustomTrees) echo 'BUILD_JAVA=25' >> "$GITHUB_ENV" ;;
            */DropsOverhaul) echo 'BUILD_JAVA=21' >> "$GITHUB_ENV" ;;
            *) echo 'Unsupported repository' >&2; exit 1 ;;
          esac
      - uses: https://data.forgejo.org/actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA }}
      - run: ./gradlew :build :common:check --no-daemon
      - uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: plugin
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-tests.jar
          if-no-files-found: error

  minecraft-targets:
    # One target per *real* server version, not an unresolvable version-family alias.
    # The same main.yml is used by LoraxCustomTrees and DropsOverhaul.
    needs: build
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select advertised Minecraft targets
        id: select
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const targets = [];
          const add = (server_type, versions, build_task, build_directory = '.', forge_build = '') => {
            for (const mc_version of versions) {
              targets.push({server_type, mc_version, build_task, build_directory, forge_build});
            }
          };
          const repo = process.env.GITHUB_REPOSITORY.split('/').pop();
          switch (repo) {
            case 'LoraxCustomTrees':
              // Exact Paper releases from COMPATIBILITY.md.
              add('paper', ['26.3'], ':build');
              add('paper', [
                '1.20', '1.20.1', '1.20.4', '1.20.5', '1.20.6',
                '1.21', '1.21.10', '1.21.11',
                '26.1.1', '26.1.2', '26.2'
              ], ':spigotModern:build');

              // BuildTools aliases 1.20 -> 1.20.1, 1.21 -> 1.21.1,
              // 26.1 -> 26.1.2; test the produced exact versions instead.
              add('spigot', ['1.12.2'], ':spigot112:build');
              add('spigot', [
                '1.20.1', '1.20.6', '1.21.1', '1.21.10',
                '26.1.2', '26.2', '26.3'
              ], ':spigotModern:build');

              // Pin the Forge builds actually advertised and locally evaluated.
              for (const [mc, dir, forge] of [
                ['1.12.2', 'forge112', '14.23.5.2864'],
                ['1.20',   'forge120', '46.0.14'],
                ['1.20.6', 'forge1206', '50.2.15'],
                ['1.21',   'forge121', '51.0.33'],
                ['1.21.10','forge12110','60.1.18'],
                ['26.1',   'forge261', '62.0.9'],
                ['26.2',   'forge262', '65.1.6'],
                ['26.3',   'forge26', '66.1.8']
              ]) add('forge', [mc], ':build', dir, forge);
              break;
            case 'DropsOverhaul':
              // Only the explicitly known current target; expand from its own
              // advertised compatibility matrix when that is available.
              add('paper', ['1.21.11'], ':build');
              break;
            default:
              throw new Error(`Unsupported repository: ${process.env.GITHUB_REPOSITORY}`);
          }
          if (targets.length === 0) throw new Error('Empty Minecraft test matrix');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify({include: targets})}\n`);
          console.log(`${repo}: checking ${targets.length} exact Minecraft server targets`);
          for (const t of targets) console.log(`${t.server_type} ${t.mc_version} (${t.build_directory} ${t.build_task})`);
          JS

  minecraft-smoke:
    name: ${{ matrix.server_type }} ${{ matrix.mc_version }}
    needs: minecraft-targets
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.minecraft-targets.outputs.matrix) }}
    uses: ./.forgejo/workflows/mc-test.yml
    with:
      server_type: ${{ matrix.server_type }}
      mc_version: ${{ matrix.mc_version }}
      build_directory: ${{ matrix.build_directory }}
      build_task: ${{ matrix.build_task }}
      forge_build: ${{ matrix.forge_build }}

  release:
    needs: [build, minecraft-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends gnupg python3
      # No checkout: repository build scripts never receive signing secrets.
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: plugin
          path: dist
      - name: Sign and verify
        env:
          CI_KEY_B64: ${{ secrets.CI_KEY_B64 }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill gpg-agent; rm -rf -- "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$CI_KEY_B64" | base64 --decode | gpg --batch --import
          unset CI_KEY_B64
          cd dist
          shopt -s nullglob
          jars=(*.jar)
          ((${#jars[@]})) || { echo 'No plugin JARs received' >&2; exit 1; }
          for jar in "${jars[@]}"; do
            [[ -f "$jar" && ! -L "$jar" && "$jar" != *$'\n'* ]] || exit 1
          done
          sha256sum -- "${jars[@]}" > SHA256SUMS
          for file in "${jars[@]}" SHA256SUMS; do
            printf '%s\n' "$CI_KEY_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign -- "$file"
            gpg --batch --verify "$file.asc" "$file"
          done
          sha256sum --check --strict SHA256SUMS
      - name: Publish draft then finalize prerelease
        env:
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_AUDIENCE: ${{ vars.RELEASE_AUDIENCE }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request, urllib.error, urllib.parse, uuid
          client_headers = {'User-Agent': 'ForgejoActions-ReleasePublisher/1.0', 'Accept': 'application/json'}
          stage = 'repository authentication'
          def open_request(request, missing=False):
              try:
                  return urllib.request.urlopen(request)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and missing:
                      return None
                  detail = error.read().decode(errors='replace')[:2000]
                  for secret in (token, os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN', '')):
                      if secret: detail = detail.replace(secret, '[redacted]')
                  metadata = {key: error.headers.get(key) for key in ('Server', 'Content-Type', 'CF-Ray') if error.headers.get(key)}
                  origin = 'Cloudflare edge' if '1010' in detail else 'Forgejo or upstream (Cloudflare may proxy the response)'
                  endpoint = urllib.parse.urlsplit(request.full_url).path
                  raise RuntimeError(f'Stage: {stage}; {request.get_method()} {endpoint}: HTTP {error.code}; origin: {origin}; headers: {metadata}; body: {detail}. If Cloudflare blocks this identified client, review the matching edge event for the trusted runner; do not change token permissions based on error 1010.') from None
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          base = os.environ['GITHUB_API_URL'].rstrip('/') + '/repos/' + '/'.join(urllib.parse.quote(p, safe='') for p in repo.split('/'))
          assert base.startswith('https://')
          token = os.environ['RELEASE_TOKEN']
          scheme = 'token'
          audience = os.environ.get('RELEASE_AUDIENCE')
          if audience:
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&' + urllib.parse.urlencode({'audience': audience})
              stage = 'Authorized Integration JWT acquisition'
              req = urllib.request.Request(url, headers={**client_headers, 'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with open_request(req) as response:
                  token = json.load(response)['value']
              print('::add-mask::' + token)
              scheme = 'Bearer'
          tag = 'build-' + sha[:12]
          def api(method, path, body=None, content_type='application/json', missing=False, raw=False):
              if isinstance(body, dict): body = json.dumps(body).encode()
              request = urllib.request.Request(base + path, data=body, method=method,
                  headers={**client_headers, 'Authorization': scheme + ' ' + token, 'Content-Type': content_type})
              try:
                  # Only explicitly expected missing resources may consume a 404.
                  response = open_request(request, missing=missing)
                  if response is None: return None
                  with response:
                      data = response.read()
                      return data if raw else json.loads(data)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors='replace')[:2000].replace(token, '[redacted]')
                  if error.code == 404 and missing: return None
                  # Reissue through the diagnostic transport for unexpected statuses.
                  open_request(request)
                  raise RuntimeError(f'{method} {path}: unexpected HTTP {error.code}: {detail}')
          api('GET', '')
          stage = 'main branch protection check'
          branch = api('GET', '/branches/main')
          if not branch.get('protected'):
              print('WARNING: main is unprotected. Release publication will continue.')
          files = sorted(pathlib.Path('dist').iterdir())
          assert files and all(p.is_file() and not p.is_symlink() and re.fullmatch(r'[A-Za-z0-9_.+-]+', p.name) for p in files)
          tagpath = '/tags/' + urllib.parse.quote(tag, safe='')
          stage = 'tag lookup and creation'
          existing_tag = api('GET', tagpath, missing=True)
          if existing_tag:
              assert existing_tag['commit']['sha'] == sha, 'Tag collision: refusing to retarget'
          else:
              api('POST', '/tags', {'tag_name': tag, 'target': sha})
          assert api('GET', tagpath)['commit']['sha'] == sha
          stage = 'release lookup and draft creation'
          release = api('GET', '/releases/tags/' + tag, missing=True)
          if release:
              assert ('Commit: ' + sha) in release['body'], 'Existing release commit mismatch'
              assert release['prerelease'], 'Existing release is not a development prerelease'
          else:
              java = '25' if repo.endswith('/LoraxCustomTrees') else '21'
              release = api('POST', '/releases', {'tag_name': tag, 'target_commitish': sha,
                  'name': 'Development Build ' + sha[:12], 'draft': True, 'prerelease': True,
                  'body': f'Repository: {repo}\nCommit: {sha}\nBranch: main\nBuild system: Gradle\nJava: {java}'})
          rid = release['id']
          print(f'Inspecting release {rid}; failures leave draft state unchanged')
          assets = api('GET', f'/releases/{rid}/assets')
          inventory = {a['name']: a for a in assets}
          assert len(inventory) == len(assets)
          assert set(inventory) <= {p.name for p in files}, 'Unexpected release assets'
          for file in files:
              stage = 'asset verification/upload: ' + file.name
              if file.name in inventory:
                  remote = api('GET', f"/releases/{rid}/assets/{inventory[file.name]['id']}", raw=True)
                  # Forgejo attachment endpoint returns metadata; download the actual content.
                  metadata = json.loads(remote)
                  url = metadata['browser_download_url']
                  assert urllib.parse.urlsplit(url).netloc == urllib.parse.urlsplit(base).netloc
                  assert urllib.parse.urlsplit(url).scheme == 'https', 'Asset download requires HTTPS'
                  req = urllib.request.Request(url, headers={**client_headers, 'Authorization': scheme + ' ' + token})
                  with open_request(req) as response: data = response.read()
                  assert data == file.read_bytes(), 'Existing asset differs (including signature): ' + file.name
                  continue
              assert release['draft'], 'Completed release missing assets; manual review required'
              boundary = uuid.uuid4().hex
              data = (f'--{boundary}\r\nContent-Disposition: form-data; name="attachment"; filename="{file.name}"\r\nContent-Type: application/octet-stream\r\n\r\n').encode() + file.read_bytes() + f'\r\n--{boundary}--\r\n'.encode()
              api('POST', f'/releases/{rid}/assets', data, 'multipart/form-data; boundary=' + boundary)
          assert {a['name'] for a in api('GET', f'/releases/{rid}/assets')} == {p.name for p in files}
          if release['draft']:
              stage = 'prerelease finalization'
              api('PATCH', f'/releases/{rid}', {'draft': False, 'prerelease': True})
          stage = 'completed release verification'
          completed = api('GET', f'/releases/{rid}')
          assert completed['prerelease'] and not completed['draft']
          print(f'Published and verified {tag}')
          PY
