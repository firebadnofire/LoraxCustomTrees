plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'org.infotoast'
version = '6.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir '../common/src/main/java'
minecraft { mappings channel: 'official', version: '1.20' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20-46.0.14' }
processResources {
    from('../src/main/resources') { include '*.bo5' }
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
jar { archiveBaseName = 'LoraxCustomTrees-forge-1.20' }
jar.finalizedBy('reobfJar')
sourceSets {
    integrationProbe {
        java.srcDir 'src/probe/java'
        resources.srcDir 'src/probe/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('integrationProbeJar', Jar) {
    dependsOn integrationProbeClasses
    archiveBaseName = 'LoraxIntegrationProbe-forge120'
    destinationDirectory = layout.buildDirectory.dir('test-libs')
    from sourceSets.integrationProbe.output
}
reobf { integrationProbeJar {} }
integrationProbeJar.finalizedBy('reobfIntegrationProbeJar')
